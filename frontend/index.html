<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f9" />
  <meta name="color-scheme" content="light dark" />
  <title>Finanzas ONG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237b78f0'/%3E%3Cstop offset='1' stop-color='%234646b8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 21.5l6-6 4 4 8-8M19.5 11.5H25v5.5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    // Apply the saved theme before first paint (no light flash in dark mode)
    try { var t = localStorage.getItem('ong_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="guest">

  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-head">
        <a class="brand" href="#/projects">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17.5 9.5 12l3.5 3.5L20 8.5"/><path d="M15 8.5h5v5"/></svg></span>
          <span>Finanzas ONG</span>
        </a>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div id="sidebar-user" class="sidebar-foot"></div>
    </aside>

    <div class="main">
      <header id="topbar" class="topbar">
        <button id="btn-back" class="icon-btn hidden" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <a id="topbar-brand" class="brand topbar-brand" href="#/projects" aria-label="Inicio">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17.5 9.5 12l3.5 3.5L20 8.5"/><path d="M15 8.5h5v5"/></svg></span>
        </a>
        <div id="nav-title" class="topbar-title">Finanzas ONG</div>
        <nav id="crumbs" class="crumbs" aria-label="Ubicación"></nav>
        <div class="topbar-actions">
          <button id="btn-notifications" class="icon-btn hidden" title="Notificaciones" aria-label="Notificaciones" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span id="notifications-badge" class="badge-count hidden">0</span>
          </button>
          <button id="btn-avatar" class="avatar-btn" aria-label="Menú de usuario" aria-haspopup="menu"></button>
        </div>
      </header>

      <main id="app" class="content"></main>
    </div>
  </div>

  <div id="notifications-panel" class="notif-panel hidden" role="dialog" aria-label="Notificaciones"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
